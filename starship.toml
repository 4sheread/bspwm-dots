format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

[directory]
style = "bold magenta"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold green"

[git_status]
style = "bold red"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

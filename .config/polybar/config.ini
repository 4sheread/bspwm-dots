[colors]
bg = #1e1e2e
fg = #cdd6f4
accent = #cba6f7
blue = #89b4fa
green = #a6e3a1
red = #f38ba8

[bar/example]
width = 100%
height = 26pt
radius = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2pt
padding-left = 2
padding-right = 2
module-margin = 1.5

font-0 = "JetBrainsMono NFM:size=10;2"

modules-left = bspwm
modules-center = date
modules-right = cpu memory

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-background = #313244
label-focused-underline= ${colors.accent}
label-focused-padding = 1.5

label-occupied = %name%
label-occupied-padding = 1.5

label-empty = %name%
label-empty-foreground = #585b70
label-empty-padding = 1.5

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S | %a %d %b
label = %date%
label-foreground = ${colors.blue}

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%
label-foreground = ${colors.green}

[module/memory]
type = internal/memory
interval = 2
label = RAM %gb_used%
label-foreground = ${colors.accent}

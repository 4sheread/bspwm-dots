[bar/example]
width = 100%
height = 24pt
radius = 0
background = #1e1e2e
foreground = #cdd6f4
line-size = 2pt
padding-left = 1
padding-right = 1
module-margin = 1
modules-left = bspwm
modules-center = date
modules-right = cpu memory

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S
label = %date%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%

[module/memory]
type = internal/memory
interval = 2
label = RAM %gb_used%
